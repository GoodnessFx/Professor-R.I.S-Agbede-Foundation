name: Deploy to Vercel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Deploy to Vercel
      # The Vercel CLI picks up VITE_ vars from the Vercel project's environment
      # variable settings (Project → Settings → Environment Variables).
      # All server-side vars (FLUTTERWAVE_SECRET_KEY, RESEND_API_KEY, ADMIN_EMAIL)
      # must be set there — they are never passed through the client build.
      #
      # Required GitHub Actions secrets:
      #   VERCEL_TOKEN   — from vercel.com → Account Settings → Tokens
      #   VERCEL_ORG_ID  — from .vercel/project.json after first `vercel link`
      #   VERCEL_PROJECT_ID — from .vercel/project.json after first `vercel link`
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        npm install -g vercel@latest
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          vercel --prod --token=$VERCEL_TOKEN --yes
        else
          vercel --token=$VERCEL_TOKEN --yes
        fi
