<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- No CSP meta tag: PXXL already sends a Content-Security-Policy response
      header from vercel.json. A second meta-tag policy would intersect with
      it and can block the app's own scripts/styles (blank page). -->

    <!-- Google Fonts: preconnect only (stylesheet loads via CSS import).
      No render-blocking font <link> so a slow/blocked font CDN
      can never leave the page blank. -->

    <link rel="icon" type="image/png" href="/images/Professor%20logo.png" />
    <title>Professor R.I.S. Agbede Foundation</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
